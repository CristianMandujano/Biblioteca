<!DOCTYPE html>
<html lang="es">

<head>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
        integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
    
    <!-- 1. Hoja de estilos anterior (OBLIGATORIA / NO SE BORRA) -->
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    
    <!-- 2. Bloque dinámico para insertar la hoja de estilos de Día de Muertos por página -->
    {% block extra_css %}{% endblock %}

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
</head>

<body>
    <div class="container-fluid site-wrapper p-0">
        <nav class="navbar navbar-expand navbar-light custom-navbar px-4">
            <a class="navbar-brand font-weight-bold" href="{{ url_for('home') }}">Biblioteca ICO</a>
            <ul class="navbar-nav ml-auto">
                <li class="nav-item">
                    <a class="nav-link" href="{{ url_for('home') }}">Inicio</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{{ url_for('catalogo') }}">Catálogo</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{{ url_for('servicios') }}">Servicios</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{{ url_for('contacto') }}">Contacto</a>
                </li>
            </ul>
        </nav>

        <main class="main-content container py-5">
            {% block content %} {% endblock %}
        </main>
    </div>
</body>

</html>
